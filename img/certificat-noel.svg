<text x="80" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#26076D">Contrôles effectués</text><rect x="80" y="283" width="20" height="20" rx="4" fill="#ECD567" stroke="#26076D" stroke-width="2.5"/><path d="M84 293l5 5 8-11" stroke="#26076D" stroke-width="3" fill="none" stroke-linecap="round"/><text x="114" y="300" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">Bonne humeur : conforme</text><rect x="80" y="321" width="20" height="20" rx="4" fill="#ECD567" stroke="#26076D" stroke-width="2.5"/><path d="M84 331l5 5 8-11" stroke="#26076D" stroke-width="3" fill="none" stroke-linecap="round"/><text x="114" y="338" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">Fous rires : dans les normes</text><rect x="80" y="359" width="20" height="20" rx="4" fill="#ECD567" stroke="#26076D" stroke-width="2.5"/><path d="M84 369l5 5 8-11" stroke="#26076D" stroke-width="3" fill="none" stroke-linecap="round"/><text x="114" y="376" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">Défaites sans revanche : aucune</text><rect x="80" y="397" width="20" height="20" rx="4" fill="#E5B4D9" stroke="#26076D" stroke-width="2.5"/><path d="M85 402l10 10M95 402l-10 10" stroke="#26076D" stroke-width="3" fill="none" stroke-linecap="round"/><text x="114" y="414" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">Fin des parties à une heure</text><text x="114" y="438" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">raisonnable : non conforme, dérogation</text><text x="114" y="462" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26076D">accordée</text><text x="80" y="510" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#26076D">Décision</text><text x="80" y="540" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#26076D">Lot libéré pour consommation immédiate, sans</text><text x="80" y="565" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#26076D">modération.</text><text x="300" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#EC7739">Joyeux Noël !</text><text x="300" y="672" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#26076D">De toute l'équipe de Pharmacotechnie</text></svg>