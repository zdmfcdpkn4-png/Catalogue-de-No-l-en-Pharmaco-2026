<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" role="img" aria-label="Avis de recherche : pion rouge, dit le Petit Rouge">
<rect width="600" height="860" fill="#DDD0EC"/>
<path d="M50 30H550L558 60L548 400L556 820L540 836H62L44 810L54 420L42 50Z" fill="#F3E3BE" stroke="#3A2410" stroke-width="3"/>
<text x="300" y="100" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#3A2410" letter-spacing="3">AVIS DE</text>
<text x="300" y="158" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#3A2410" letter-spacing="3">RECHERCHE</text>
<rect x="190" y="182" width="220" height="200" fill="#FFFBF2" stroke="#3A2410" stroke-width="4"/>
<g transform="translate(300 300)"><circle cy="-62" r="26" fill="#C62828" stroke="#3A2410" stroke-width="4"/><path d="M-16 -38H16L30 40H-30Z" fill="#C62828" stroke="#3A2410" stroke-width="4" stroke-linejoin="round"/><path d="M-50 40H50Q56 40 56 46V62H-56V46Q-56 40 -50 40Z" fill="#C62828" stroke="#3A2410" stroke-width="4"/><circle cx="-9" cy="-66" r="3.5" fill="#3A2410"/><circle cx="9" cy="-66" r="3.5" fill="#3A2410"/><path d="M-8 -52H8" stroke="#3A2410" stroke-width="3" stroke-linecap="round"/></g>
<text x="300" y="420" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#3A2410">PION ROUGE, dit « le Petit Rouge »</text><text x="80" y="462" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410"><tspan font-weight="700">Signalement :</tspan> 2 cm, tête ronde, socle large,</text><text x="80" y="488" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410">regard fixe.</text><text x="80" y="526" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410"><tspan font-weight="700">Vu pour la dernière fois</tspan> le 24 décembre vers</text><text x="80" y="552" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410">23 h, au bord de la table, juste avant que</text><text x="80" y="578" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410">quelqu'un crie « J'ai gagné ! ».</text><text x="80" y="616" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410"><tspan font-weight="700">Pistes :</tspan> sous le canapé, dans la poche d'un</text><text x="80" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3A2410">cousin, dans la boîte d'un autre jeu.</text><text x="300" y="710" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="#C62828">RÉCOMPENSE</text><text x="300" y="742" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#3A2410">une partie sans finir dernier</text><text x="80" y="788" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#3A2410">Tout renseignement est à transmettre au service des</text><text x="80" y="810" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#3A2410">pièces non conformes de la Pharmacotechnie.</text></svg>