<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Avis de recherche western : pion rouge, alias le Petit Rouge, disparu le soir du 24 décembre">
<defs><filter id="ombre" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dx="10" dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="papier"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
<filter id="bois"><feTurbulence type="fractalNoise" baseFrequency=".008 .25" numOctaves="3" seed="8"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .27  0 0 0 0 .15  0 0 0 -1.2 1.25"/></filter>
<filter id="vieux"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="5"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .18  0 0 0 .55 -.05"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
<radialGradient id="brul" cx=".5" cy=".5" r=".72"><stop offset=".72" stop-color="#7A4A1E" stop-opacity="0"/><stop offset="1" stop-color="#5A3010" stop-opacity=".55"/></radialGradient>
<radialGradient id="tete" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FF8A80"/><stop offset=".45" stop-color="#D32F2F"/><stop offset="1" stop-color="#7F1010"/></radialGradient>
<linearGradient id="corps" x1="0" x2="1"><stop offset="0" stop-color="#8E1414"/><stop offset=".35" stop-color="#E53935"/><stop offset=".6" stop-color="#C62828"/><stop offset="1" stop-color="#6E0E0E"/></linearGradient>
<radialGradient id="clou" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ddd"/><stop offset="1" stop-color="#555"/></radialGradient></defs>
<rect width="600" height="900" fill="#8A5A32"/><rect width="600" height="900" filter="url(#bois)"/>
<path d="M0 300H600M0 610H600" stroke="#3A2410" stroke-opacity=".35" stroke-width="3"/>
<g filter="url(#ombre)"><path id="feuille" d="M46 34L554 26L560 300L548 560L556 860L330 870L318 852L300 868L44 862L52 520L40 260Z" fill="#EAD7A8"/></g>
<g filter="url(#vieux)"><use href="#feuille"/></g><use href="#feuille" fill="url(#brul)"/>
<circle cx="470" cy="760" r="46" fill="none" stroke="#7A4A1E" stroke-opacity=".25" stroke-width="7"/><circle cx="470" cy="760" r="41" fill="none" stroke="#7A4A1E" stroke-opacity=".12" stroke-width="3"/>
<circle cx="300" cy="52" r="9" fill="url(#clou)" stroke="#333"/><path d="M296 58l3 9 4-1" stroke="#0004" stroke-width="2" fill="none"/>
<text x="300" y="126" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="66" font-weight="700" fill="#3A2410" letter-spacing="4">RECHERCHÉ</text>
<text x="300" y="160" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#3A2410">debout ou couché</text>
<path d="M100 176H500" stroke="#3A2410" stroke-width="2"/><path d="M100 182H500" stroke="#3A2410" stroke-width="1"/>
<g transform="rotate(-2 300 300)"><rect x="185" y="196" width="230" height="210" fill="#F4EDE0" stroke="#3A2410" stroke-width="3"/><rect x="195" y="206" width="210" height="190" fill="#DCD4C6"/>
<path d="M195 300H405M195 330H405M195 360H405" stroke="#9C9284" stroke-width="1"/><text x="200" y="296" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#6E665A">3 cm</text><text x="200" y="326" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#6E665A">2 cm</text><text x="200" y="356" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#6E665A">1 cm</text>
<ellipse cx="300" cy="384" rx="62" ry="9" fill="#000" opacity=".25"/>
<path d="M240 370Q240 356 256 354H344Q360 356 360 370V380Q300 392 240 380Z" fill="url(#corps)"/>
<path d="M281 278H319L338 356H262Z" fill="url(#corps)"/><ellipse cx="300" cy="279" rx="24" ry="7" fill="#9E1A1A"/>
<circle cx="300" cy="252" r="30" fill="url(#tete)"/><ellipse cx="290" cy="240" rx="9" ry="6" fill="#fff" opacity=".35"/>
<rect x="250" y="388" width="100" height="14" fill="#1F1F1F"/><text x="300" y="399" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#eee" letter-spacing="1">N° PR-2412</text></g>
<text x="300" y="446" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#3A2410">PION ROUGE</text>
<text x="300" y="472" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-style="italic" fill="#3A2410">alias « le Petit Rouge », alias « celui qui manque toujours »</text><text x="78" y="508" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410"><tspan font-weight="700">Signalement :</tspan> 2 cm, tête ronde, socle large, regard fixe.</text><text x="78" y="528" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">Aucune expression, même quand il perd.</text><text x="78" y="555" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410"><tspan font-weight="700">Signe particulier :</tspan> légère trace de dents (le chien,</text><text x="78" y="575" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">2024).</text><text x="78" y="602" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410"><tspan font-weight="700">Dernière apparition :</tspan> le 24 décembre vers 23 h, au bord de</text><text x="78" y="622" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">la table, juste avant que quelqu'un crie « J'ai gagné ! »</text><text x="78" y="642" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">et secoue la nappe.</text><text x="78" y="669" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410"><tspan font-weight="700">Complices présumés :</tspan> le chat, l'aspirateur, le cousin aux</text><text x="78" y="689" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">grandes poches.</text><text x="78" y="716" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410"><tspan font-weight="700">Remplacé provisoirement par :</tspan> un bouchon de flacon, qui ne</text><text x="78" y="736" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#3A2410">fait pas illusion.</text><text x="300" y="789" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#8E1414" letter-spacing="3">RÉCOMPENSE</text>
<text x="300" y="815" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#3A2410">une partie sans finir dernier, et le droit de choisir sa couleur</text><text x="78" y="843" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#3A2410">Tout renseignement au service des pièces non conformes de la</text><text x="78" y="860" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#3A2410">Pharmacotechnie. Ne pas tenter de l'appréhender seul : il roule.</text></svg>