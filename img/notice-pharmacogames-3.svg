<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="tpg2"><title id="tpg2">Case 3, Au chrono. Un chronomètre tourne à côté du flacon concentré : « Cinq questions, 30 ou 40 secondes chacune, une seule prise, 2 points pièce. Dose : 2 points à 2 près, 1 point à 10 près. »</title><rect x="13" y="13" width="380" height="280" rx="18" fill="#26076D"/><rect x="6" y="6" width="380" height="280" rx="18" fill="#D6E6F5" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="18" width="158" height="32" rx="8" fill="#ECD567" stroke="#26076D" stroke-width="4"/><text font-family="Arial,Helvetica,sans-serif" x="33" y="41" font-size="19" font-weight="700" fill="#26076D">3. Au chrono</text><path d="M288 144L300 168L312 144Z" fill="#fff" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="60" width="360" height="88" rx="16" fill="#fff" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M291 146h18" stroke="#fff" stroke-width="7"/><text font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26076D" text-anchor="middle"><tspan x="200" y="90">Cinq questions, 30 ou 40 s chacune,</tspan><tspan x="200" y="112">une seule prise, 2 points pièce.</tspan><tspan x="200" y="134">Dose : 2 pts à ±2, 1 pt à ±10.</tspan></text><path d="M24 262h346" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(130 214)"><rect x="-8" y="-50" width="16" height="10" rx="3" fill="#EC7739" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle r="38" fill="#fff" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 0V-26M0 0l16 10" stroke="#26076D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle r="4" fill="#26076D"/><text font-family="Arial,Helvetica,sans-serif" x="0" y="26" f