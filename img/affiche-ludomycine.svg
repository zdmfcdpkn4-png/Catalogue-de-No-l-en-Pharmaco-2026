310.0" cy="56" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="310.0" cy="64" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="323.0" cy="60" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="323.0" cy="64" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="336.0" cy="56" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="336.0" cy="60" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="336.0" cy="64" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="349.0" cy="56" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><circle cx="349.0" cy="60" r="1.3" fill="#fff" stroke="#bbb" stroke-width=".6"/><rect x="60" y="70" width="12" height="210" fill="#EC7739"/><path d="M335 70H440V280H395Z" fill="#E5B4D9" opacity=".55"/><path d="M378 70H440V280H428Z" fill="#26076D" opacity=".9"/>
<text x="90" y="122" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" fill="#26076D" letter-spacing="1">LUDOMYCINE</text>
<text x="90" y="156" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#EC7739">500 mg</text>
<text x="90" y="180" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#333">Comprimés pelliculés de bonne humeur</text>
<text x="90" y="199" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#333">À partager · voie orale (surtout pour râler)</text>
<text x="90" y="228" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#222">Boîte de 2 à 6 joueurs · dès 8 ans</text>
<text x="90" y="248" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555">Médicament à prescription familiale facultative</text>
<text x="90" y="267" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#777">Lot DEC-2026 · EXP : jusqu'à la prochaine dispute</text>
<path transform="translate(406 132) scale(0.62)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#ECD567"/><path transform="translate(412 182) scale(0.5)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#FFFBF2"/><path transform="translate(404 228) scale(0.5)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#EC7739"/><g transform="matrix(1 -0.571 0 1 440 70)">
<text x="8" y="22" font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700" fill="#333">Lire attentivement la règle</text><text x="8" y="33" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#333">avant utilisation.</text>
<path d="M35 52L52 82H18Z" fill="#fff" stroke="#C62828" stroke-width="3" stroke-linejoin="round"/><text x="35" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="900" fill="#111">!</text>
<text x="8" y="98" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#333">Ne pas conduire la partie</text><text x="8" y="107" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#333">si vous êtes mauvais perdant.</text>
