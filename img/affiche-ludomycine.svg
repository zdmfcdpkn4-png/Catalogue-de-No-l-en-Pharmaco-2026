<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-label="Boîte et notice parodiques d'un faux médicament : LUDOMYCINE 500 mg, comprimés de bonne humeur à partager, boîte de 2 à 6 joueurs">
<defs><filter id="ombre" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dx="10" dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="papier"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter><linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E1F2"/><stop offset="1" stop-color="#CDBFE0"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEEDF2"/></linearGradient>
<linearGradient id="cote" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9D6E0"/><stop offset="1" stop-color="#C4C0CE"/></linearGradient>
<linearGradient id="pli" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".48" stop-color="#000" stop-opacity=".07"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset=".52" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
<rect width="600" height="780" fill="url(#tbl)"/><g transform="rotate(2.5 300 640)" filter="url(#ombre)"><g filter="url(#papier)"><rect x="38" y="352" width="530" height="372" fill="#FBFAF6"/></g>
<rect x="38" y="352" width="265" height="372" fill="url(#pli)"/><rect x="303" y="352" width="265" height="372" fill="url(#pli)"/><path d="M38 538H568" stroke="#000" stroke-opacity=".06" stroke-width="2"/>
<text x="303" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#222">NOTICE : INFORMATION DU JOUEUR</text>
<text x="303" y="402" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#444">LUDOMYCINE 500 mg, comprimé pelliculé de bonne humeur</text><path d="M58 412H548" stroke="#222" stroke-width="1"/><text x="58" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Composition :</tspan> principe actif : ludothérapine,</text><text x="58" y="443.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">500 mg. Excipients : un plateau, 84 pions</text><text x="58" y="457.2" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">(dont 3 sous le canapé), une règle de 24</text><text x="58" y="470.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">pages. Excipient à effet notoire : la</text><text x="58" y="484.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">mauvaise foi.</text><text x="58" y="504" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Indications :</tspan> grisaille de décembre, repas de</text><text x="58" y="517.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">famille qui s'éternisent, cousin qui a</text><text x="58" y="531.2" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">ressorti son téléphone.</text><text x="58" y="550.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Posologie :</tspan> une partie le soir. Chez le sujet</text><text x="58" y="564.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">âgé (Tonton), réduire la durée des</text><text x="58" y="578" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">explications. Ne jamais dépasser « une</text><text x="58" y="591.5999999999999" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">dernière », sauf si vous êtes en train de</text><text x="58" y="605.1999999999999" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">gagner.</text><text x="58" y="624.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Mode d'administration :</tspan> autour d'une table,</text><text x="58" y="638.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">avec des chips. Ne pas avaler les dés.</text><text x="58" y="658" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Contre-indications :</tspan> allergie connue à la</text><text x="58" y="671.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">défaite ; joueur qui lit la règle à voix</text><text x="58" y="685.2" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">haute pendant quarante minutes.</text><text x="318" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Interactions :</tspan> association déconseillée avec</text><text x="318" y="443.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">le téléphone portable et avec le cousin qui</text><text x="318" y="457.2" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">« connaît une variante ».</text><text x="318" y="476.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Effets indésirables :</tspan> très fréquents (plus</text><text x="318" y="490.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">d'un joueur sur dix) : fous rires, « c'est</text><text x="318" y="504" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">pas juste ! ». Fréquents : demande de</text><text x="318" y="517.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">revanche, alliance trahie. Rares : plateau</text><text x="318" y="531.2" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">renversé. Très rares : quelqu'un range la</text><text x="318" y="544.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">boîte correctement.</text><text x="318" y="564.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Surdosage :</tspan> au-delà de quatre heures de</text><text x="318" y="578" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">partie, aérer la pièce et commander des</text><text x="318" y="591.6" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">pizzas.</text><text x="318" y="611.1999999999999" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Conservation :</tspan> à l'abri du chat (voir le 8</text><text x="318" y="624.8" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">décembre) et des petits frères.</text><text x="318" y="644.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222"><tspan font-weight="700">Titulaire :</tspan> Laboratoires de Pharmacotechnie</text><text x="318" y="658" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#222">ludique, lot DEC-2026.</text></g><g filter="url(#ombre)">
