<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" role="img" aria-label="Boîte et notice parodiques : LUDOMYCINE 500 mg, comprimés à partager, boîte de 2 à 6 joueurs">
<rect width="600" height="860" fill="#DDD0EC"/>
<rect x="48" y="38" width="512" height="230" rx="10" fill="#26076D" opacity=".25"/>
<rect x="40" y="30" width="512" height="230" rx="10" fill="#FFFBF2" stroke="#26076D" stroke-width="4"/>
<rect x="40" y="30" width="512" height="62" rx="10" fill="#EC7739" stroke="#26076D" stroke-width="4"/><rect x="42" y="70" width="508" height="22" fill="#EC7739"/>
<text x="296" y="73" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#FFFBF2" stroke="#26076D" stroke-width="5" paint-order="stroke" letter-spacing="2">LUDOMYCINE</text>
<text x="70" y="135" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#26076D">500 mg</text>
<text x="70" y="167" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#26076D">comprimés à partager</text>
<text x="70" y="197" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26076D">Boîte de 2 à 6 joueurs</text>
<text x="70" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#26076D" opacity=".8">Lot DEC-2026 · libéré par la Pharmacotechnie</text>
<path transform="translate(410 160) scale(1.1)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#ECD567" stroke="#26076D" stroke-width="2.2727272727272725" stroke-linejoin="round"/><path transform="translate(470 175) scale(0.9)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#E5B4D9" stroke="#26076D" stroke-width="2.7777777777777777" stroke-linejoin="round"/><path transform="translate(450 120) scale(0.7)" d="M0 -30C9 -30 13 -23 12 -15C11 -10 9 -8 9 -6C17 -4 27 -1 30 4C32 8 28 11 22 10L14 9C15 16 19 24 22 30L5 30L0 20L-5 30L-22 30C-19 24 -15 16 -14 9L-22 10C-28 11 -32 8 -30 4C-27 -1 -17 -4 -9 -6C-9 -8 -11 -10 -12 -15C-13 -23 -9 -30 0 -30Z" fill="#EC7739" stroke="#26076D" stroke-width="3.5714285714285716" stroke-linejoin="round"/>
<rect x="372" y="200" width="150" height="40" rx="20" fill="#ECD567" stroke="#26076D" stroke-width="3"/><path d="M447 200V240" stroke="#26076D" stroke-width="3"/>
<g transform="rotate(-1.2 300 560)"><rect x="40" y="295" width="520" height="535" fill="#FFFBF2" stroke="#26076D" stroke-width="3"/>
<text x="300" y="333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#EC7739" letter-spacing="3">NOTICE : INFORMATION DU JOUEUR</text>
<path d="M70 348H530" stroke="#26076D" stroke-width="1.5" stroke-dasharray="4 5" opacity=".4"/><text x="70" y="380" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Composition :</tspan> un plateau, des pions, une règle.</text><text x="70" y="403" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">Excipient à effet notoire : la mauvaise foi.</text><text x="70" y="439" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Indications :</tspan> grisaille de décembre, soirées sans écran,</text><text x="70" y="462" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">cousins qui s'ennuient.</text><text x="70" y="498" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Posologie :</tspan> une partie le soir, à renouveler tant que</text><text x="70" y="521" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">tout le monde est d'accord. Ne pas dépasser « une</text><text x="70" y="544" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">dernière ».</text><text x="70" y="580" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Contre-indications :</tspan> joueur qui lit la règle à voix</text><text x="70" y="603" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">haute pendant quarante minutes.</text><text x="70" y="639" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Effets indésirables :</tspan> très fréquents : fous rires,</text><text x="70" y="662" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">« c'est pas juste ! ». Fréquents : demande de revanche.</text><text x="70" y="685" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D">Rares : plateau renversé.</text><text x="70" y="721" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#26076D"><tspan font-weight="700">Conservation :</tspan> à l'abri du chat (voir le 8 décembre).</text></g></svg>